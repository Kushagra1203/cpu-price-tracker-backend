name: daily-scrape

on:
  schedule:
    - cron: "30 15 * * *" # 21:00 IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL_CA: certs/ca.pem
      FRONTEND_PAT: ${{ secrets.FRONTEND_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Write CA certificate from secret
        run: |
          mkdir -p certs
          echo "${{ secrets.DB_SSL_CA }}" > certs/ca.pem

      - name: Verify DB secrets are configured
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::DB secrets missing. Add DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL_CA in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run pipeline (scrape -> normalize -> MySQL)
        run: python master_script.py

      - name: Refresh frontend JSONs and push to website repo
        if: env.FRONTEND_PAT != ''
        run: |
          git clone --depth 1 https://x-access-token:${FRONTEND_PAT}@github.com/Kushagra1203/CPU-Price-Tracker.git frontend
          python export_website_json.py frontend
          cd frontend
          git config user.name "cpu-price-bot"
          git config user.email "kushagra120303@gmail.com"
          git add data/processors.json data/price-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi
