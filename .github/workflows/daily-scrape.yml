name: daily-scrape

on:
  schedule:
    - cron: "30 15 * * *" # 21:00 IST
  workflow_dispatch:

jobs:
  scrape:
    # Pinned, not ubuntu-latest. `ubuntu-latest` rolled forward to 26.04 and
    # Playwright 1.54 refuses to install chromium there ("Playwright does not
    # support chromium on ubuntu26.04-x64"), which failed this job every night
    # from 2026-11-12 onward at the "Install dependencies" step.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL_CA: certs/ca.pem
      FRONTEND_PAT: ${{ secrets.FRONTEND_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Write CA certificate from secret
        run: |
          mkdir -p certs
          echo "${{ secrets.DB_SSL_CA }}" > certs/ca.pem

      - name: Verify DB secrets are configured
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::DB secrets missing. Add DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL_CA in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run pipeline (scrape -> normalize -> MySQL)
        # continue-on-error so a vendor health-check failure does not stop the
        # frontend refresh below: a partial snapshot is still worth publishing.
        # The job is failed again explicitly at the end.
        id: pipeline
        continue-on-error: true
        run: python master_script.py

      - name: Refresh frontend JSONs and push to website repo
        if: env.FRONTEND_PAT != ''
        run: |
          git clone --depth 1 https://x-access-token:${FRONTEND_PAT}@github.com/Kushagra1203/CPU-Price-Tracker.git frontend
          python export_website_json.py frontend
          cd frontend
          git config user.name "cpu-price-bot"
          git config user.email "kushagra120303@gmail.com"
          git add data/processors.json data/price-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Fail if the vendor health check reported problems
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Pipeline exited non-zero - a vendor was missing or well below its previous row count. See the VENDOR CHECK FAILED lines above."
          exit 1
