name: daily-scrape

on:
  schedule:
    - cron: "30 15 * * *" # 21:00 IST
  workflow_dispatch:

jobs:
  scrape:
    # Windows, not ubuntu. Measured on 2026-11-19/20: GitHub's two hosted
    # pools differ at the vendors' edges. Shweta answered 200-first-try with
    # 81 rows on the Windows pool twice, while the Ubuntu pool drew 429 seven
    # times in the same hour (Shopify's per-IP budget on the shared pool).
    # SCL Gaming and PC Studio 403 identically on both pools -- their
    # Cloudflare rules refuse both IP ranges on every route -- so they are
    # fed by the local nightly run instead (see cron + README). The full
    # pipeline was verified on windows-latest first: 32 tests pass, the
    # MySQL insert with the CA cert works, and the frontend push is
    # unchanged. Costs 2x minutes (~5 min/night); well inside the free tier.
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_SSL_CA: certs/ca.pem
      FRONTEND_PAT: ${{ secrets.FRONTEND_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # --with-deps is apt-based (linux only); on Windows the pip package
        # plus the browser download is all that is needed.
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Write CA certificate from secret
        run: |
          mkdir -p certs
          echo "${{ secrets.DB_SSL_CA }}" > certs/ca.pem

      - name: Verify DB secrets are configured
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASSWORD" ]; then
            echo "::error::DB secrets missing. Add DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL_CA in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run pipeline (scrape -> normalize -> MySQL)
        # continue-on-error so a vendor health-check failure does not stop the
        # frontend refresh below: a partial snapshot is still worth publishing.
        # The job is failed again explicitly at the end.
        id: pipeline
        continue-on-error: true
        run: python master_script.py

      # Each spider now writes its own log file instead of interleaving three
      # crawls into the run log, so this is where the detail lives when a
      # vendor comes back short.
      - name: Upload per-spider logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spider-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Refresh frontend JSONs and push to website repo
        if: env.FRONTEND_PAT != ''
        run: |
          git clone --depth 1 https://x-access-token:${FRONTEND_PAT}@github.com/Kushagra1203/CPU-Price-Tracker.git frontend
          python export_website_json.py frontend
          cd frontend
          git config user.name "cpu-price-bot"
          git config user.email "kushagra120303@gmail.com"
          git add data/processors.json data/price-history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: daily refresh $(date -u +%F)"
            git push
          fi

      - name: Fail if the vendor health check reported problems
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "::error::Pipeline exited non-zero - a vendor was missing or well below its previous row count. See the VENDOR CHECK FAILED lines above."
          exit 1
